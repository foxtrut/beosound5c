# BeoSound 5c: Bluetooth audio without a local login session.
#
# WirePlumber 0.5 only starts its BlueZ monitor — which registers the A2DP
# endpoints with bluetoothd and creates bluez_output.* sinks — for a user with
# an active seat session. The BS5c's audio stack runs under systemd --user
# (lingering) and nobody logs in at a seat, so without this a paired Bluetooth
# speaker connects but never gets a sink.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
